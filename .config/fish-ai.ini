[fish-ai]
configuration = openrouter

[openrouter]
provider = self-hosted
server = https://openrouter.ai/api/v1
model = deepseek/deepseek-v4-flash-0731
# api_key is intentionally omitted here; fish-ai falls back to the macOS
# keyring (service "fish-ai", account "openrouter") when this is unset.
# Run `fish_ai_put_api_key` (or `security add-generic-password -s fish-ai
# -a openrouter -w` on macOS) to store the key.
